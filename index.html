<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>+-$</title>

<meta name="theme-color" content="#12110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="+-$">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- =============== PRISIJUNGIMAS =============== -->
<section id="login" class="login" hidden>
  <div class="login__inner">
    <p class="eyebrow">Darbo apskaita</p>
    <h1 class="login__title"><img src="./icons/logo.png" alt="+-$"></h1>
    <form id="login-form" class="stack">
      <label class="field">
        <span class="field__label">El. paštas</span>
        <input type="email" id="login-email" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field__label">Slaptažodis</span>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn--solid" id="login-btn">Prisijungti</button>
      <p class="note" id="login-error" role="alert" hidden></p>
    </form>
  </div>
</section>

<!-- =============== PAGRINDINIS =============== -->
<main id="app" class="app" hidden>

  <header class="bar">
    <button class="icon-btn" id="menu-open" aria-label="Meniu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 class="bar__title" id="view-title">Pagrindinis</h1>
    <button class="icon-btn" id="period-open" aria-label="Pasirinkti laikotarpį">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
    </button>
  </header>

  <p class="period" id="period-label">—</p>

  <!-- trys sumos: tik pagrindiniame -->
  <section class="totals" id="totals-main">
    <div class="tot">
      <span class="tot__label">Pelnas</span>
      <span class="tot__amt tot__amt--profit" id="t-profit">—</span>
    </div>
    <button class="tot tot--tap" id="go-expense">
      <span class="tot__label">Išlaidos</span>
      <span class="tot__amt tot__amt--out" id="t-expense">—</span>
    </button>
    <button class="tot tot--tap" id="go-income">
      <span class="tot__label">Pajamos</span>
      <span class="tot__amt tot__amt--in" id="t-income">—</span>
    </button>
  </section>

  <!-- viena suma: pajamų / išlaidų languose -->
  <section class="totals totals--single" id="totals-single" hidden>
    <div class="tot">
      <span class="tot__label" id="t-single-label">Iš viso</span>
      <span class="tot__amt" id="t-single">—</span>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>

  <nav class="dock">
    <button class="fab" id="add-open" aria-label="Pridėti įrašą">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>
</main>

<!-- =============== MENIU =============== -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer__scrim" data-close-drawer></div>
  <nav class="drawer__panel" aria-label="Skyriai">
    <p class="drawer__brand"><img src="./icons/logo.png" alt="+-$"></p>
    <button class="drawer__item" data-view="main">Pagrindinis</button>
    <button class="drawer__item" data-view="income">Pajamos</button>
    <button class="drawer__item" data-view="expense">Išlaidos</button>
    <button class="drawer__item" data-view="invoices">Sąskaitos</button>
    <button class="drawer__item" data-view="subs">Prenumeratos</button>
    <div class="drawer__foot">
      <button class="drawer__logout" id="logout">Atsijungti</button>
      <span class="drawer__ver" id="app-version"></span>
    </div>
  </nav>
</div>

<!-- =============== LAIKOTARPIS =============== -->
<div class="sheet" id="period-sheet" hidden>
  <div class="sheet__scrim" data-close-period></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <h2 class="sheet__title">Laikotarpis</h2>
    <div class="chips">
      <button class="chip" data-preset="this-month">Šis mėnuo</button>
      <button class="chip" data-preset="last-month">Praėjęs mėnuo</button>
      <button class="chip" data-preset="this-year">Šie metai</button>
      <button class="chip" data-preset="all">Viskas</button>
    </div>
    <div class="row2">
      <label class="field">
        <span class="field__label">Nuo</span>
        <input type="date" id="p-from">
      </label>
      <label class="field">
        <span class="field__label">Iki</span>
        <input type="date" id="p-to">
      </label>
    </div>
    <button class="btn btn--solid" id="period-apply">Rodyti</button>
    <button class="btn btn--ghost" data-close-period>Atšaukti</button>
  </div>
</div>

<!-- =============== PRIDĖJIMAS =============== -->
<div class="sheet" id="add-sheet" hidden>
  <div class="sheet__scrim" data-close-add></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <h2 class="sheet__title" id="add-title">Naujas įrašas</h2>

    <div class="seg" id="kind-seg">
      <button class="seg__btn" data-kind="expense">Išlaidos</button>
      <button class="seg__btn" data-kind="income">Pajamos</button>
      <button class="seg__btn" data-kind="subscription">Prenumerata</button>
    </div>

    <form id="entry-form" class="stack" novalidate>

      <div class="amount">
        <input type="text" id="f-amount" inputmode="decimal" placeholder="0,00"
               autocomplete="off" aria-label="Suma">
        <span class="amount__cur">EUR</span>
      </div>

      <label class="field">
        <span class="field__label">Data</span>
        <input type="date" id="f-date">
      </label>

      <label class="field" id="w-party">
        <span class="field__label" id="l-party">Kam sumokėta</span>
        <input type="text" id="f-party" autocomplete="off" placeholder="pvz. Senukai">
      </label>

      <label class="field" id="w-name" hidden>
        <span class="field__label">Prenumeratos pavadinimas</span>
        <input type="text" id="f-name" autocomplete="off" placeholder="pvz. Adobe">
      </label>

      <label class="check" id="w-personal" hidden>
        <input type="checkbox" id="f-personal">
        <span>Pirkta iš asmeninių pinigų</span>
      </label>

      <label class="field" id="w-end" hidden>
        <span class="field__label">Prenumeratos pabaigos data</span>
        <input type="date" id="f-end">
      </label>

      <div class="field">
        <span class="field__label">Sąskaita arba čekis <em>neprivaloma</em></span>
        <input type="file" id="f-file" accept="image/*,application/pdf" hidden>
        <button type="button" class="filebox" id="file-pick">
          <span id="file-name">Nufotografuoti arba pasirinkti</span>
        </button>
        <button type="button" class="filedrop" id="file-clear" hidden>Pašalinti failą</button>
      </div>

      <p class="note" id="add-error" role="alert" hidden></p>

      <button type="submit" class="btn btn--solid" id="save-btn">Išsaugoti</button>
      <button type="button" class="btn btn--ghost" data-close-add>Atšaukti</button>
    </form>
  </div>
</div>

<!-- =============== ĮRAŠO LANGAS =============== -->
<div class="sheet" id="detail-sheet" hidden>
  <div class="sheet__scrim" data-close-detail></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <button class="detail__x" data-close-detail aria-label="Uždaryti">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <p class="detail__date" id="d-date">—</p>
    <p class="detail__amount" id="d-amount">—</p>
    <dl class="detail__rows" id="d-rows"></dl>
    <div id="d-file"></div>

    <div class="detail__confirm" id="d-confirm" hidden>
      <p>Tikrai ištrinti šį įrašą? Atkurti nebus galima.</p>
      <div class="row2">
        <button class="btn btn--ghost" id="d-cancel">Ne, palikti</button>
        <button class="btn btn--danger" id="d-yes">Taip, ištrinti</button>
      </div>
    </div>

    <div class="detail__tools" id="d-tools">
      <button class="icon-btn" id="d-edit" aria-label="Koreguoti">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>
        </svg>
      </button>
      <button class="icon-btn icon-btn--danger" id="d-del" aria-label="Ištrinti">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
